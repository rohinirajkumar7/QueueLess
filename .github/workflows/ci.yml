name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: queueless
          POSTGRES_PASSWORD: queueless
          POSTGRES_DB: queueless_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U queueless"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://queueless:queueless@localhost:5432/queueless_test
      JWT_SECRET: ci-test-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        # Includes test_queue_concurrency.py, which requires the real
        # Postgres service above - SKIP LOCKED isn't meaningfully
        # testable against SQLite, so this suite intentionally does
        # not run against an in-memory DB.
        run: python -m pytest tests/ -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: queueless
          POSTGRES_PASSWORD: queueless
          POSTGRES_DB: queueless_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U queueless"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://queueless:queueless@localhost:5432/queueless_dev
      JWT_SECRET: ci-test-secret
      VITE_API_URL: http://localhost:8000/api/v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Migrate and seed dev data
        working-directory: backend
        run: |
          alembic upgrade head
          python seed.py

      - name: Start backend
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          echo "backend did not become healthy in time"; cat /tmp/backend.log; exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  load-test:
    runs-on: ubuntu-latest
    needs: [backend-tests]
    # Informational only: results depend heavily on the runner's CPU
    # count (Argon2 password hashing is CPU-bound), so this does not
    # gate merges - it's here so P95/error-rate numbers are visible on
    # every push rather than only when someone remembers to run it
    # locally. See loadtests/queueless.js for what it exercises and why.
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: queueless
          POSTGRES_PASSWORD: queueless
          POSTGRES_DB: queueless_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U queueless"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://queueless:queueless@localhost:5432/queueless_dev
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Migrate and seed dev data
        working-directory: backend
        run: |
          alembic upgrade head
          python seed.py

      - name: Start backend
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          echo "backend did not become healthy in time"; cat /tmp/backend.log; exit 1

      - uses: grafana/setup-k6-action@v1

      - name: Run k6 load test
        run: k6 run -e BASE_URL=http://localhost:8000 loadtests/queueless.js
